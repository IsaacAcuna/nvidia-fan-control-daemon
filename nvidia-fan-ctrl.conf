# Installed as /etc/default/nvidia-fan-ctrl
#
# UUIDs of the GPUs to control, from `nvidia-smi -L`, separated by spaces.
# Every listed GPU gets the same fan curve. The service won't start until
# at least one is set.
#
# Example:
# GPU_UUIDS="GPU-11111111-2222-3333-4444-555555555555 GPU-66666666-7777-8888-9999-000000000000"
GPU_UUIDS=""
